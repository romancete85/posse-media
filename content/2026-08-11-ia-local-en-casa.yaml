titulo: 'IA local: cómo corro 4 modelos en un mini-PC de mi casa'
cuerpo: |
  Corro 4 modelos de IA en un mini-PC de mi casa. Sin GPU. Gratis. Te cuento cómo. 🧠

  Viven en un contenedor liviano del homelab, y no uso uno para todo: uno por tarea.

  🟢 llama3.2:3b → lo rápido (borradores, tareas simples).
  🔵 qwen2.5:14b → cuando importa la calidad del texto.
  🟣 nomic-embed-text → RAG: buscar en la doc de mis proyectos.
  🟡 llava:7b → leer imágenes y escribir el alt-text.

  El truco que más movió la aguja: keep_alive. Mantiene el modelo caliente en RAM; sin eso pagás ~20
  segundos de recarga cada vez que lo llamás.

  Ahora, la verdad incómoda: en CPU un modelo de 14b tarda minutos. Local no es más rápido ni más
  inteligente que la nube.

  ¿Entonces por qué? Gratis, sin rate limits, y —lo que más me importa como Cloud Security— los datos
  no salen de casa. La misma IA que gobierno con semáforo corre acá, en mi living.

  👇 ¿Vos correrías IA local, o la nube te resuelve? ¿Qué modelo estás usando?
