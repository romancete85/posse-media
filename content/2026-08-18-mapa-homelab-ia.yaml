titulo: 'El sistema completo: una IA opera mi infraestructura, con gobernanza'
cuerpo: |
  Hace poco mostré UNA pieza de mi homelab — cómo corro IA local en casa. Explotó: +33.000 personas
  y un debate técnico enorme. 🔥

  Me pidieron el panorama completo. Acá está: el sistema ENTERO. Porque no es un experimento suelto
  — es una IA operando mi infraestructura, sola, con gobernanza. 🗺️

  Cómo se conecta todo, de arriba a abajo:

  🧠 Claude (nube) — el cerebro. Planifica, decide y opera el cluster por la API de Proxmox con un
  token MCP scopeado: read-only en producción, operator solo en el sandbox.

  🔐 Ollama (local) — lo privado. Modelos Q4 con keep_alive para generación, RAG y visión. Nada sale de casa.

  🚦 Gobernanza — cada operación se clasifica (verde / amarillo / rojo) y el permiso lo dan las ACLs
  de Proxmox, nunca el prompt. Lo destructivo, siempre con gate humano.

  🖥️ Proxmox — 2 nodos y sus guests: firewall (pfSense), túnel (Cloudflare), backup server (PBS),
  n8n, secrets (Vaultwarden) y el pipeline que publica esta misma serie (este post incluido).

  🗄️ Backup/DR off-box y probado. Regla 3-2-1, casera.

  Es la misma arquitectura que armo para clientes enterprise, a escala de living.

  👇 ¿Overkill para una casa… o así vamos a operar la infra en 5 años?
