titulo: 'El sistema completo: una IA opera mi infraestructura, con gobernanza'
cuerpo: |
  La semana pasada mostré UNA pieza de mi homelab — cómo corro IA local en casa. Explotó: +33.000
  personas y una charla técnica enorme. 🔥

  Hoy va el sistema ENTERO. Porque eso no es un experimento suelto: es una IA operando mi
  infraestructura, sola, con gobernanza. 🗺️

  Cómo se conecta todo:

  🧠 Claude (nube) — el cerebro. Opera el cluster por la API de Proxmox con un token MCP scopeado:
  read-only en producción, operator solo en el sandbox.

  🔐 Ollama (local) — lo privado. Modelos Q4 con keep_alive: generación, RAG y visión. Nada sale de casa.

  🚦 Gobernanza — cada operación se clasifica (verde/amarillo/rojo) y el permiso lo dan las ACLs de
  Proxmox, no el prompt. Lo destructivo, siempre gateado.

  🖥️ Proxmox — 2 nodos, con todos sus guests: firewall (pfSense), túnel (Cloudflare), backup server
  (PBS), n8n, secrets (Vaultwarden), y el pipeline que publica esta serie (este post incluido).

  🗄️ Backup/DR off-box, probado. Regla 3-2-1.

  Es lo mismo que hago para clientes enterprise, a escala de homelab.

  👇 ¿Overkill para una casa, o así se va a operar la infra en 5 años?
