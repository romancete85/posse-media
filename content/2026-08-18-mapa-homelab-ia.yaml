titulo: 'Un homelab operado por IA: el mapa de cómo se conecta todo'
cuerpo: |
  Vengo contando pedazos de mi homelab operado por IA: la gobernanza, el backup. Hoy va el mapa
  completo. 🗺️

  Arriba está el sistema entero. Las piezas:

  🧠 El cerebro — Claude, en la nube. Planifica, decide y conecta todo: opera Proxmox por un token
  MCP scopeado, y se enchufa con conectores (calendar, GitHub) y con n8n.

  🔐 La IA local — Ollama, modelos en un guest sin GPU, para lo privado. Dos IAs, un sistema: una
  decide, la otra guarda secretos.

  🚦 La gobernanza — semáforo + ACL. El permiso lo da la ACL, no el prompt. Y lo destructivo siempre
  pasa por mí.

  🖥️ La infra — Proxmox, 2 nodos: producción (read-only para la IA) y sandbox (donde sí crea y rompe).

  🗄️ Y la red de seguridad — backup off-box, probado.

  El detalle que más me gusta: n8n orquesta los flujos… incluso el que publicó este mismo post. El
  homelab se auto-opera y se auto-promociona.

  De acá en más, cada post es un zoom a una parte de este mapa.

  👇 ¿Qué abro primero: el cerebro (MCP), las dos IAs, o la orquestación?
